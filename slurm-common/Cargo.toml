[package]
name = "slurm-common"
version = "0.1.0"
edition = "2021"

[features]
ssh = [
    "russh", "russh-config", "russh-sftp", "sha2", "hex",
    "dirs", "clap", "log", "futures", "tokio-util", "bytes", "tokio-stream"
]


[dependencies]
tokio = { version = "1.49.0", features = ["process", "macros", "rt", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
serde_json = "1.0"
regex = "1.12.2"
paste = "1.0.15"
uuid = { version = "1.20.0", features = ["serde", "v7"] }

russh = { version = "0.57", optional = true }
russh-config = { version = "0.57", optional = true }
russh-sftp = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
dirs = { version = "5.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
log = { version = "0.4", optional = true }
futures = { version = "0.3.31", optional = true }
tokio-util = { version = "0.7.18", features = ["io"], optional = true }
bytes = { version = "1.11.1", optional = true }
tokio-stream = { version = "0.1.18", optional = true }